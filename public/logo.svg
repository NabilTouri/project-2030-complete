<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="#185fa5"/>
  <!-- Bar 1 (shortest, left) -->
  <rect x="18" y="62" width="16" height="20" rx="4" fill="white" opacity="0.7"/>
  <!-- Bar 2 (medium, center) -->
  <rect x="42" y="46" width="16" height="36" rx="4" fill="white" opacity="0.85"/>
  <!-- Bar 3 (tallest, right) -->
  <rect x="66" y="28" width="16" height="54" rx="4" fill="white"/>
  <!-- Dot on bar 1 -->
  <circle cx="26" cy="57" r="5" fill="white" opacity="0.7"/>
  <!-- Dot on bar 2 -->
  <circle cx="50" cy="41" r="5" fill="white" opacity="0.85"/>
  <!-- Dot on bar 3 -->
  <circle cx="74" cy="23" r="5" fill="white"/>
  <!-- Trend line connecting dots -->
  <polyline points="26,57 50,41 74,23" stroke="white" stroke-width="2.5" stroke-opacity="0.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
</svg>
